<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🍾 Бутылочка — Целуй и Знакомься</title>
<style>
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  background: radial-gradient(1200px 800px at 70% -10%, #2a2a4a, #14142b 70%);
  color: #fff;
}
button { font-family: inherit; cursor: pointer; border: none; }
input { font-family: inherit; }

#start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; overflow: auto; }
.card { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 20px; padding: 28px; width: 100%; max-width: 430px; backdrop-filter: blur(8px); margin: auto; }
.card h1 { margin: 0 0 6px; font-size: 28px; }
.card p.sub { margin: 0 0 18px; opacity: .75; font-size: 14px; line-height: 1.4; }
.card label { display: block; font-size: 13px; opacity: .8; margin: 14px 0 6px; }
.card input[type=text] { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff; font-size: 14px; }
.card input[type=range] { width: 100%; }
#countVal { font-weight: 700; color: #ffd54a; }
.bigbtn { margin-top: 22px; width: 100%; padding: 14px; border-radius: 999px; font-size: 17px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#e91e63,#9c27b0); transition: .15s; }
.bigbtn:hover { filter: brightness(1.15); }

#game { display: none; flex-direction: column; height: 100vh; height: 100dvh; }
#topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; gap: 10px; flex-wrap: wrap; }
#topbar h1 { font-size: 16px; margin: 0; opacity: .9; }
#turnLabel { font-weight: 700; font-size: 14px; color: #ffd54a; }
#topbar button { background: rgba(255,255,255,.1); color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 13px; margin-left: 6px; }
#topbar button:hover { background: rgba(255,255,255,.2); }
#main { flex: 1; display: flex; min-height: 0; }
#table-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 8px; min-width: 0; overflow: auto; }
#table { position: relative; width: min(88vw, 500px); aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #a06a3a, #6b4423 70%, #4e2f18); box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 18px 50px rgba(0,0,0,.55); flex: none; }
#table::after { content: ''; position: absolute; inset: 9%; border-radius: 50%; border: 2px dashed rgba(255,255,255,.15); pointer-events: none; }
#players { position: absolute; inset: 0; }
.player { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; user-select: none; z-index: 4; }
.avatar { position: relative; width: 62px; height: 62px; border-radius: 50%; background: rgba(20,20,40,.88); border: 3px solid rgba(255,255,255,.35); display: flex; align-items: center; justify-content: center; font-size: 29px; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.player.you .avatar { border-color: #ffd54a; box-shadow: 0 0 18px rgba(255,213,74,.55); }
.player.turn .avatar { border-color: #4fc3f7; animation: pulse 1.2s infinite; }
.player.target .avatar { border-color: #ff5c8d; box-shadow: 0 0 20px rgba(255,92,141,.7); }
.player .name { font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px #000; max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kisscount { position: absolute; bottom: -6px; right: -10px; background: #e91e63; border-radius: 999px; padding: 1px 6px; font-size: 10px; font-weight: 700; border: 2px solid #14142b; display: none; }
.splat { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); font-size: 24px; display: none; }
.player.hit .avatar { animation: shake .5s; }
.player.happy .avatar { animation: bounce .6s; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(79,195,247,.6); } 50% { box-shadow: 0 0 0 10px rgba(79,195,247,0); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-5px) rotate(-4deg); } 40% { transform: translateX(5px) rotate(4deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes bounce { 0%,100% { transform: scale(1); } 40% { transform: scale(1.25); } }

#bottle-holder { position: absolute; left: 50%; top: 50%; width: 24%; max-width: 118px; transform: translate(-50%,-50%) rotate(0deg); z-index: 5; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
#bottle-holder svg { width: 100%; height: auto; display: block; }

#controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(88vw, 500px); flex: none; }
#statusLabel { font-size: 15px; font-weight: 600; min-height: 20px; color: #ffd54a; text-align: center; }
#spinBtn { padding: 12px 36px; border-radius: 999px; font-size: 17px; font-weight: 700; color: #fff; background: linear-gradient(90deg,#e91e63,#9c27b0); transition: .15s; }
#spinBtn:disabled { background: rgba(255,255,255,.15); cursor: default; }
#spinBtn:not(:disabled):hover { filter: brightness(1.15); }
#decide { display: none; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15); padding: 12px 16px; border-radius: 14px; text-align: center; }
#decide.show { display: block; }
#decideText { font-size: 14px; margin-bottom: 8px; }
#decide button { font-size: 24px; padding: 8px 20px; border-radius: 12px; background: rgba(255,255,255,.12); margin: 0 4px; }
#decide button:hover { background: rgba(255,255,255,.25); }
#gifts { display: flex; gap: 8px; align-items: center; }
#gifts span { font-size: 12px; opacity: .7; }
#gifts button { font-size: 22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.1); border: 2px solid transparent; }
#gifts button.armed { border-color: #ffd54a; background: rgba(255,213,74,.25); }

#chat-panel { width: 320px; background: rgba(255,255,255,.05); border-left: 1px solid rgba(255,255,255,.08); display: flex; flex-direction: column; min-height: 0; flex: none; }
#chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.msg { font-size: 13px; background: rgba(255,255,255,.06); padding: 6px 10px; border-radius: 10px; max-width: 95%; line-height: 1.35; }
.msg .who { font-weight: 700; color: #4fc3f7; }
.msg.sys { background: transparent; opacity: .7; font-style: italic; }
.msg.me { align-self: flex-end; background: rgba(156,39,176,.25); }
#board { padding: 10px 12px; border-top: 1px solid rgba(255,255,255,.08); font-size: 12px; opacity: .9; }
#board b { color: #ffd54a; }
#chatrow { display: flex; gap: 6px; padding: 10px; border-top: 1px solid rgba(255,255,255,.08); }
#chatInput { flex: 1; padding: 9px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.3); color: #fff; font-size: 13px; min-width: 0; }
#sendBtn { padding: 9px 14px; border-radius: 10px; background: rgba(255,255,255,.15); color: #fff; }

#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.flyer { position: fixed; font-size: 34px; transform: translate(-50%,-50%); z-index: 51; }
.heart { position: fixed; font-size: 22px; z-index: 51; transform: translate(-50%,-50%); animation: rise 1.1s ease-out forwards; }
@keyframes rise { to { transform: translate(calc(-50% + var(--dx)), calc(-50% - 90px)) scale(1.15); opacity: 0; } }

@media (max-width: 900px) {
  #main { flex-direction: column; }
  #chat-panel { width: 100%; height: 230px; border-left: none; border-top: 1px solid rgba(255,255,255,.08); }
  #table { width: min(90vw, 380px); }
  #controls { width: min(90vw, 380px); }
  .avatar { width: 54px; height: 54px; font-size: 25px; }
}
</style>
</head>
<body>

<div id="start">
  <div class="card">
    <h1>🍾 Бутылочка</h1>
    <p class="sub">«Целуй и знакомься» — автономная версия. Крутите бутылочку по кругу, целуйте того, на кого она укажет, или кидайте помидорами. Дарите подарки и общайтесь в чате.</p>
    <label>Ваше имя</label>
    <input type="text" id="nameInput" value="Вы" maxlength="20">
    <label>Игроков за столом: <span id="countVal">5</span></label>
    <input type="range" id="countRange" min="2" max="10" value="5">
    <label>Имена ботов (через запятую)</label>
    <input type="text" id="botsInput" value="Аня, Дима, Маша, Саша, Лёша, Вера, Тимур, Соня" maxlength="200">
    <button class="bigbtn" id="startBtn">🍾 Начать игру</button>
  </div>
</div>

<div id="game">
  <div id="topbar">
    <h1>🍾 Целуй и Знакомься</h1>
    <div id="turnLabel"></div>
    <div>
      <button id="resetBtn">🔄 Заново</button>
      <button id="muteBtn">🔊</button>
    </div>
  </div>
  <div id="main">
    <div id="table-wrap">
      <div id="table">
        <div id="players"></div>
        <div id="bottle-holder">
          <svg viewBox="0 0 100 280">
            <defs>
              <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#66bb6a"/>
                <stop offset=".5" stop-color="#388e3c"/>
                <stop offset="1" stop-color="#1b5e20"/>
              </linearGradient>
            </defs>
            <rect x="38" y="0" width="24" height="16" rx="4" fill="#c62828"/>
            <path d="M42 16 h16 v38 c0 16 18 20 18 44 v140 c0 16 -12 24 -26 24 s-26 -8 -26 -24 v-140 c0 -24 18 -28 18 -44 z" fill="url(#glass)" stroke="#145214" stroke-width="2"/>
            <rect x="30" y="138" width="40" height="48" rx="7" fill="#fff8e1" opacity=".92"/>
            <text x="50" y="158" text-anchor="middle" font-size="14" font-family="sans-serif" fill="#c2185b" font-weight="bold">KISS</text>
            <text x="50" y="179" text-anchor="middle" font-size="15">💋</text>
          </svg>
        </div>
      </div>
      <div id="controls">
        <div id="statusLabel"></div>
        <button id="spinBtn">🍾 Крутить</button>
        <div id="decide">
          <div id="decideText"></div>
          <div>
            <button id="kissBtn" title="Поцеловать">💋</button>
            <button id="tomatoBtn" title="Не целую — помидор!">🍅</button>
          </div>
        </div>
        <div id="gifts">
          <span>Подарок → игрок:</span>
          <button data-g="🌹">🌹</button>
          <button data-g="🧸">🧸</button>
          <button data-g="💐">💐</button>
        </div>
      </div>
    </div>
    <div id="chat-panel">
      <div id="chat"></div>
      <div id="board"></div>
      <div id="chatrow">
        <input id="chatInput" placeholder="Своё сообщение…" maxlength="140">
        <button id="sendBtn">➤</button>
      </div>
    </div>
  </div>
</div>

<div id="fx"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const playersEl = $('players'), bottle = $('bottle-holder');
const statusLabel = $('statusLabel'), spinBtn = $('spinBtn');
const decideEl = $('decide'), decideText = $('decideText');
const chatEl = $('chat'), boardEl = $('board'), chatInput = $('chatInput');
const turnLabel = $('turnLabel');

const BOT_NAMES = ['Аня','Дима','Маша','Саша','Лёша','Вера','Тимур','Соня','Марк','Юля'];
const BOT_AVATARS = ['🦊','🐱','🐶','🐻','🐰','🦄','🐨','🐼','🦁','🐸'];
const LINES = {
  greet: ['Приветик! 🥰','Кто сегодня целует? 😏','Ура, стол полный! Давай!','Бутылочка ждёт!'],
  idle: ['Ставь музыку и крути 🎧','Кто дальше? Жду-у-у 😉','Мне кажется, бутылочка заскучала!','Давно ты не целовал(а) 💋'],
  kissed: ['Ммм… 💋','Сердечко бьётся! ❤️','Ох, приятно!','Ещё хочешь!'],
  tomato: ['Ай! Больно же! 😤','Помидор?! За что?! 🍅','Ага, запомню это!'],
  reply: ['Согласен(на)!','Ахаха 😄','Давай, крути!','Класс, играем ещё!']
};
let players = [];
let state = { started:false, angle:0, spinning:false, deciding:false, turnIndex:0, lastTarget:-1, muted:false };
let autoTimer = null, idleTimer = null, armedGift = null;

/* ---------- audio ---------- */
let AC = null;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return AC; }
function tone(freq, dur, vol, type, when) {
  if (state.muted) return;
  vol = vol || 0.12; type = type || 'sine'; when = when || 0;
  const a = ac(); if (!a) return;
  const t = a.currentTime + when;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  tick() { tone(1400, 0.03, 0.04, 'square'); },
  whoosh() {
    if (state.muted) return;
    const a = ac(); if (!a) return;
    const t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(700, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.6);
    f.type = 'lowpass'; f.frequency.value = 900;
    g.gain.setValueAtTime(0.09, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.7);
    o.connect(f); f.connect(g); g.connect(a.destination);
    o.start(t); o.stop(t + 0.7);
  },
  kiss() { tone(880, 0.12, 0.12, 'sine'); tone(1175, 0.18, 0.12, 'sine', 0.1); },
  splat() { tone(120, 0.18, 0.2, 'triangle'); tone(80, 0.2, 0.15, 'sine', 0.05); },
  gift() { tone(660, 0.1, 0.1, 'sine'); tone(990, 0.15, 0.1, 'sine', 0.08); }
};

/* ---------- game setup ---------- */
function buildGame() {
  const name = $('nameInput').value.trim() || 'Вы';
  const count = +$('countRange').value;
  let botNames = $('botsInput').value ? $('botsInput').value.split(',').map(s => s.trim()).filter(Boolean) : [];
  if (!botNames.length) botNames = BOT_NAMES.slice();
  while (botNames.length < count - 1) botNames.push(BOT_NAMES[botNames.length % BOT_NAMES.length]);
  players = [{ name: name, avatar: '😎', isYou: true, bot: false, kisses: 0, gifts: 0 }];
  for (let i = 0; i < count - 1; i++) {
    players.push({ name: botNames[i], avatar: BOT_AVATARS[i % BOT_AVATARS.length], isYou: false, bot: true, kisses: 0, gifts: 0 });
  }
  Object.assign(state, { started: true, angle: 0, spinning: false, deciding: false, turnIndex: 0, lastTarget: -1 });
  armedGift = null;
  bottle.style.transform = 'translate(-50%,-50%) rotate(0deg)';
  renderPlayers();
  chatEl.innerHTML = '';
  clearTimers();
  $('start').style.display = 'none';
  $('game').style.display = 'flex';
  sys('Стол собран! Вы начинаете — крутите бутылочку!');
  players.forEach((p, i) => { if (p.bot) setTimeout(() => botSay(i, LINES.greet), 1500 + i * 1200); });
  updateTurnUI();
  updateBoard();
  startIdleChat();
}

function renderPlayers() {
  playersEl.innerHTML = '';
  players.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'player' + (p.isYou ? ' you' : '');
    el.innerHTML = '<div class="avatar"><span class="face"></span><span class="kisscount"></span><span class="splat"></span></div><div class="name"></div>';
    el.querySelector('.face').textContent = p.avatar;
    el.querySelector('.name').textContent = p.name;
    el.addEventListener('click', () => onPlayerClick(i));
    p.el = el;
    playersEl.appendChild(el);
  });
  layoutPlayers();
  players.forEach((_, i) => updateBadge(i));
}

function layoutPlayers() {
  const N = players.length;
  players.forEach((p, i) => {
    const a = (-90 + 360 * i / N) * Math.PI / 180;
    const R = 40;
    p.el.style.left = (50 + R * Math.cos(a)) + '%';
    p.el.style.top = (50 + R * Math.sin(a)) + '%';
  });
}

function updateBadge(i) {
  const p = players[i], b = p.el.querySelector('.kisscount');
  const parts = [];
  if (p.kisses) parts.push('💋' + p.kisses);
  if (p.gifts) parts.push('🎁' + p.gifts);
  b.textContent = parts.join(' ');
  b.style.display = parts.length ? 'block' : 'none';
}

function updateTurnUI() {
  if (!state.started) return;
  const ti = state.turnIndex, sp = players[ti];
  players.forEach((p, i) => p.el.classList.toggle('turn', i === ti && !state.spinning));
  turnLabel.textContent = sp.isYou ? '🍾 Ваш ход' : 'Крутит: ' + sp.name;
  spinBtn.disabled = !state.started || state.spinning || state.deciding || !sp.isYou;
  spinBtn.textContent = sp.isYou ? '🍾 Крутить' : 'Ждём…';
}

/* ---------- spin ---------- */
function spin() {
  if (!state.started || state.spinning || state.deciding) return;
  const sp = state.turnIndex, N = players.length;
  const others = [];
  for (let i = 0; i < N; i++) if (i !== sp) others.push(i);
  const target = others[Math.floor(Math.random() * others.length)];
  state.lastTarget = target;
  const seatDeg = ((-90 + 360 * target / N) % 360 + 360) % 360;
  const jitter = Math.random() * 14 - 7;
  const cur = ((state.angle % 360) + 360) % 360;
  const delta = ((seatDeg + jitter - cur) % 360 + 360) % 360;
  const total = (3 + Math.floor(Math.random() * 3)) * 360 + delta;
  const start = state.angle, dur = 2600 + Math.random() * 1000, t0 = performance.now();
  state.spinning = true;
  hideDecide();
  statusLabel.textContent = 'Крутится…';
  spinBtn.disabled = true;
  sfx.whoosh();
  let lastPassed = -1;
  function frame(now) {
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 4);
    state.angle = start + total * e;
    bottle.style.transform = 'translate(-50%,-50%) rotate(' + state.angle + 'deg)';
    const passed = Math.floor(state.angle / (360 / N));
    if (passed !== lastPassed) { lastPassed = passed; sfx.tick(); }
    if (t < 1) requestAnimationFrame(frame);
    else { state.spinning = false; onLanded(sp, target); }
  }
  requestAnimationFrame(frame);
}

function onLanded(sp, target) {
  state.deciding = true;
  const t = players[target];
  t.el.classList.add('target');
  setTimeout(() => t.el && t.el.classList.remove('target'), 2500);
  updateTurnUI();
  if (players[sp].isYou) {
    statusLabel.textContent = 'Бутылочка на: ' + t.name + '!';
    decideText.textContent = 'Бутылочка указывает на ' + t.name + '. Целуешь?';
    decideEl.classList.add('show');
  } else {
    statusLabel.textContent = players[sp].name + ' думает…';
    autoTimer = setTimeout(() => {
      if (!state.started) return;
      if (Math.random() < 0.7) doKiss(sp, target); else doTomato(sp, target);
      nextTurn();
    }, 1500 + Math.random() * 1300);
  }
}

function doKiss(sp, tg) {
  const p = players[sp], t = players[tg];
  t.kisses++; updateBadge(tg);
  hideDecide();
  t.el.classList.remove('happy'); void t.el.offsetWidth; t.el.classList.add('happy');
  burst(tg, '💗');
  sfx.kiss();
  sys(p.isYou ? 'Вы поцеловали ' + t.name + ' 💋' : p.name + ' поцеловал(а) ' + t.name + ' 💋');
  if (t.bot) setTimeout(() => botSay(tg, LINES.kissed), 700);
  updateBoard();
}

function doTomato(sp, tg) {
  const p = players[sp], t = players[tg];
  hideDecide();
  const c = centerPoint(), tp = targetPoint(tg);
  fly('🍅', c.x, c.y, tp.x, tp.y, 650, () => {
    t.el.classList.remove('hit'); void t.el.offsetWidth; t.el.classList.add('hit');
    const s = t.el.querySelector('.splat');
    s.textContent = '🍅'; s.style.display = 'block';
    setTimeout(() => { s.style.display = 'none'; }, 2500);
    sfx.splat();
  });
  sys(p.isYou ? 'Вы закинули ' + t.name + ' помидором 🍅' : p.name + ' закинул(а) ' + t.name + ' помидором 🍅');
  if (t.bot) setTimeout(() => botSay(tg, LINES.tomato), 900);
}

function nextTurn() {
  if (!state.started) return;
  state.deciding = false;
  state.turnIndex = (state.turnIndex + 1) % players.length;
  hideDecide();
  const p = players[state.turnIndex];
  if (p.bot) {
    statusLabel.textContent = p.name + ' скоро закрутит…';
    autoTimer = setTimeout(spin, 1200 + Math.random() * 1500);
  } else {
    statusLabel.textContent = 'Ваш ход — крутите бутылочку!';
  }
  updateTurnUI();
  updateBoard();
}

function hideDecide() { decideEl.classList.remove('show'); }

/* ---------- gifts ---------- */
document.querySelectorAll('#gifts button').forEach(b => b.addEventListener('click', () => {
  const g = b.dataset.g;
  armedGift = (armedGift === g) ? null : g;
  updateGiftButtons();
}));
function updateGiftButtons() {
  document.querySelectorAll('#gifts button').forEach(b => b.classList.toggle('armed', b.dataset.g === armedGift));
}
function onPlayerClick(i) {
  if (armedGift == null) return;
  const g = armedGift;
  armedGift = null;
  updateGiftButtons();
  throwGift(g, i);
}
function throwGift(g, i) {
  const t = players[i];
  t.gifts++; updateBadge(i);
  const c = centerPoint(), tp = targetPoint(i);
  fly(g, c.x, c.y, tp.x, tp.y, 800, () => { burst(i, '✨'); sfx.gift(); });
  sys('Вы подарили ' + t.name + ' ' + g + '!');
  if (t.bot) setTimeout(() => botSay(i, LINES.kissed), 800);
  updateBoard();
}

/* ---------- fx ---------- */
function centerPoint() { const r = bottle.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function targetPoint(i) { const r = players[i].el.querySelector('.avatar').getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
function fly(ch, fx0, fy0, tx, ty, dur, done) {
  const el = document.createElement('div');
  el.className = 'flyer'; el.textContent = ch;
  el.style.left = fx0 + 'px'; el.style.top = fy0 + 'px';
  $('fx').appendChild(el);
  const dx = tx - fx0, dy = ty - fy0;
  const anim = el.animate([
    { transform: 'translate(-50%,-50%) scale(.5)' },
    { transform: 'translate(-50%,-50%) translate(' + dx * 0.5 + 'px, ' + (dy * 0.5 - 90) + 'px) scale(1.3)', offset: 0.5 },
    { transform: 'translate(-50%,-50%) translate(' + dx + 'px, ' + dy + 'px) scale(.9)' }
  ], { duration: dur, easing: 'cubic-bezier(.25,.75,.45,1)' });
  anim.onfinish = () => { el.remove(); done && done(); };
}
function burst(i, ch) {
  const p = targetPoint(i);
  for (let k = 0; k < 6; k++) {
    const s = document.createElement('span');
    s.className = 'heart';
    s.textContent = ch;
    s.style.left = p.x + 'px'; s.style.top = p.y + 'px';
    s.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    $('fx').appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

/* ---------- chat ---------- */
function addMsg(who, text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  if (who) {
    const w = document.createElement('span');
    w.className = 'who'; w.textContent = who;
    el.appendChild(w);
    el.appendChild(document.createTextNode(' ' + text));
  } else el.textContent = text;
  chatEl.appendChild(el);
  chatEl.scrollTop = chatEl.scrollHeight;
}
function sys(t) { addMsg(null, t, 'sys'); }
function botSay(i, pool) {
  if (!state.started || !players[i]) return;
  const p = players[i];
  const text = Array.isArray(pool) ? pool[Math.floor(Math.random() * pool.length)] : pool;
  addMsg(p.name, text, 'bot');
}
function startIdleChat() {
  clearInterval(idleTimer);
  idleTimer = setInterval(() => {
    if (!state.started || Math.random() > 0.45) return;
    const bots = [];
    players.forEach((p, i) => { if (p.bot) bots.push(i); });
    if (!bots.length) return;
    botSay(bots[Math.floor(Math.random() * bots.length)], LINES.idle);
  }, 8000);
}
function sendChat() {
  const v = chatInput.value.trim();
  if (!v) return;
  chatInput.value = '';
  addMsg('Вы', v, 'me');
  if (Math.random() < 0.6) {
    const bots = [];
    players.forEach((p, i) => { if (p.bot) bots.push(i); });
    if (bots.length) setTimeout(() => botSay(bots[Math.floor(Math.random() * bots.length)], LINES.reply), 1200);
  }
}
$('sendBtn').addEventListener('click', sendChat);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

/* ---------- leaderboard ---------- */
function updateBoard() {
  const top = players.slice().sort((a, b) => b.kisses - a.kisses).slice(0, 3);
  const medals = ['🥇','🥈','🥉'];
  boardEl.innerHTML = '<b>Лидеры поцелуев:</b> ' + top.map((p, i) => medals[i] + ' ' + p.name + ' — ' + p.kisses).join(' · ');
}

/* ---------- controls ---------- */
$('startBtn').addEventListener('click', buildGame);
$('countRange').addEventListener('input', function () { $('countVal').textContent = this.value; });
spinBtn.addEventListener('click', spin);
$('kissBtn').addEventListener('click', () => { if (!state.deciding) return; doKiss(state.turnIndex, state.lastTarget); nextTurn(); });
$('tomatoBtn').addEventListener('click', () => { if (!state.deciding) return; doTomato(state.turnIndex, state.lastTarget); nextTurn(); });
$('resetBtn').addEventListener('click', resetGame);
$('muteBtn').addEventListener('click', function () {
  state.muted = !state.muted;
  this.textContent = state.muted ? '🔇' : '🔊';
});
function clearTimers() { clearTimeout(autoTimer); clearInterval(idleTimer); autoTimer = null; idleTimer = null; }
function resetGame() {
  clearTimers();
  players.forEach(p => { if (p.el) p.el.remove(); });
  players = [];
  state.started = false;
  armedGift = null;
  hideDecide();
  updateGiftButtons();
  $('game').style.display = 'none';
  $('start').style.display = 'flex';
}
</script>
</body>
